services:
  postfix:
    image: docker.io/mwader/postfix-relay:1.1.39
    container_name: postfix
    environment:
      - POSTFIX_myhostname=postfix
    volumes:
      - ./config/postfix-relay/sasl_passwd:/etc/postfix/sasl_passwd:rw
      - postfix_spool:/var/spool/postfix
    restart: unless-stopped

    networks:
      - monitoring

    healthcheck:
      test:
        - CMD-SHELL
        - |
          postfix status || true
          # …. (reszta twojego healthchecka bez zmian)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postfix_spool:

networks:
  monitoring:
    external: true