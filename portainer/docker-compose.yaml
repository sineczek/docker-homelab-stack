version: '3.8'

services:
  portainer:
    image: ${PORTAINER_IMAGE}
    container_name: ${PORTAINER_CONTAINER_NAME}
    ports:
      - "${PORTAINER_PORT_HTTP}:8000"
      - "${PORTAINER_PORT_HTTPS}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PORTAINER_VOLUME_DATA}:/data
    networks:
      - frontend
    restart: always

volumes:
  portainer_data:

networks:
  frontend:
    external: true