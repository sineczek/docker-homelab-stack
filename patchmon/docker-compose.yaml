services:
  patchmon-backend:
    image: ghcr.io/patchmon/patchmon-backend:latest
    container_name: patchmon-backend
    restart: unless-stopped
    environment:
      # PostgreSQL
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@patchmon-db:5432/${POSTGRES_DB}

      # Publiczny adres instancji (np. do linków w UI/agentach)
      - PUBLIC_URL=${PATCHMON_PUBLIC_URL}

      # JWT
      - JWT_SECRET=${JWT_SECRET}

      # >>> Redis (oficjalne nazwy dla PatchMon/BullMQ)
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}

      - CORS_ORIGIN=${CORS_ORIGIN}
      - SERVER_PROTOCOL=${SERVER_PROTOCOL}
      - SERVER_HOST=${SERVER_HOST}
      - SERVER_PORT=${SERVER_PORT}
      - TRUST_PROXY=${TRUST_PROXY}
      - ENABLE_HSTS=${ENABLE_HSTS}

      # Środowisko
      - PATCHMON_ENV=production

    depends_on:
      - patchmon-db
      - patchmon-redis

    networks:
      - proxy_net

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  patchmon-frontend:
    image: ghcr.io/patchmon/patchmon-frontend:latest
    container_name: patchmon-frontend
    restart: unless-stopped
    environment:
      - BACKEND_HOST=patchmon-backend
      - BACKEND_PORT=3001

    depends_on:
      - patchmon-backend
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  patchmon-db:
    image: postgres:15
    container_name: patchmon-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - patchmon_pgdata:/var/lib/postgresql/data
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  patchmon-redis:
    image: redis:7-alpine
    container_name: patchmon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - patchmon_redisdata:/data
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  proxy_net:
    external: true

volumes:
  patchmon_pgdata:
  patchmon_redisdata: