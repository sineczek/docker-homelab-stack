server {
  listen 51820;
  server_name _;

  access_log off;

  location = /stub_status {
    stub_status;
    access_log off;

    allow 127.0.0.1;
    allow 172.16.0.0/12;  # obejmuje 172.16.0.0–172.31.255.255 (typowe dla Docker bridge)
    deny all;
  }
}
