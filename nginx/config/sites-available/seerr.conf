server {
    server_name seerr.sinq.cc;

    location / {
        proxy_pass http://192.168.4.104:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/seerr.sinq.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seerr.sinq.cc/privkey.pem;
}

server {
    listen 80;
    server_name seerr.sinq.cc;
    return 301 https://$host$request_uri;
}