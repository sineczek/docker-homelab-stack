server {
    listen 443 ssl;
    http2 on;
    server_name pulpit.sinq.cc;

    ssl_certificate     /etc/letsencrypt/live/pulpit.sinq.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulpit.sinq.cc/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # (opcjonalnie) jeśli chcesz większe bezpieczeństwo po testach:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://192.168.4.97:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}