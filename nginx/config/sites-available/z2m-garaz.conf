server {
    listen 443 ssl;
    http2 on;
    server_name z2m-garaz.sinq.cc;

    ssl_certificate     /etc/letsencrypt/live/z2m-garaz.sinq.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/z2m-garaz.sinq.cc/privkey.pem;

    location / {
        proxy_pass http://192.168.4.35:8082;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
