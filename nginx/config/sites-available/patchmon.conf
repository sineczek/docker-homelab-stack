# Upewnij się, że masz też resolver 127.0.0.11 w http{} lub nad serwerem
resolver 127.0.0.11 ipv6=off valid=30s;

server {
    listen 443 ssl;
    http2 on;
    server_name patchmon.sinq.cc;

    ssl_certificate     /etc/letsencrypt/live/patchmon.sinq.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patchmon.sinq.cc/privkey.pem;

    # FRONTEND → port 3000
    location / {
        proxy_pass http://patchmon-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # BACKEND API → 3001 (bez zmian)
    location /api/ {
        proxy_pass http://patchmon-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}