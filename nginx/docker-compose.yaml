services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./config/sites-available:/etc/nginx/sites-available:ro
      - ./config/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/letsencrypt:ro
      - ./secrets:/etc/nginx/secrets:ro
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && exit 0 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 45s

  nginx-ui:
    image: uozi/nginx-ui:latest
    container_name: nginx-ui
    restart: unless-stopped
    user: root
    environment:
      - TZ=Europe/Warsaw

      # Nginx UI ma edytować konfigurację z tej ścieżki (hostowe ./config podpięte poniżej)
      - NGINX_UI_NGINX_CONFIG_DIR=/data/prod-nginx

      # Container Control: sterowanie nginxem w INNYM kontenerze po docker.sock
      - NGINX_UI_NGINX_CONTAINER_NAME=nginx

      # (opcjonalnie, ale sensowne) PID nginx w oficjalnym nginx to /var/run/nginx.pid
      - NGINX_UI_NGINX_PID_PATH=/var/run/nginx.pid
    volumes:
      # STAN nginx-ui (DB / ustawienia)
      - ./nginx-ui:/etc/nginx-ui

      # Produkcyjny config nginx (RW dla UI) pod INNĄ ścieżką:
      - ./config:/data/prod-nginx:rw

      # certy/sekrety do podglądu (RO)
      - ./certs:/etc/letsencrypt:ro
      - ./secrets:/etc/nginx/secrets:ro

      # wymagane do Container Control
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy_net
    expose:
      - "9000"
      #- "80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "( (command -v curl >/dev/null 2>&1 && curl -fsS http://127.0.0.1:9000/ >/dev/null) || (command -v wget >/dev/null 2>&1 && wget -qO- http://127.0.0.1:9000/ >/dev/null) || (command -v nc >/dev/null 2>&1 && nc -z 127.0.0.1 9000) )"
        ]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 45s



  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: certbot
    restart: "no"
    volumes:
      - ./certs:/etc/letsencrypt
      - ./cloudflare/cloudflare.ini:/cloudflare.ini:ro
    # entrypoint: /bin/sh
    networks:
      - proxy_net


  nginx-ui-stub-proxy:
    image: alpine/socat:latest
    container_name: nginx-ui-stub-proxy
    restart: unless-stopped
    depends_on:
      - nginx
      - nginx-ui
    # współdzielona przestrzeń sieciowa z nginx-ui -> 127.0.0.1 jest wspólne
    network_mode: "service:nginx-ui"
    command: "tcp-listen:51820,fork,reuseaddr tcp-connect:nginx:51820"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          # sprawdź połączenie TCP do backendu (nginx:51820) z timeoutem
          "socat - TCP4:nginx:51820,connect-timeout=2 </dev/null >/dev/null 2>&1"
        ]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s


networks:
  proxy_net:
    external: true
