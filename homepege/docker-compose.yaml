version: '3.8'

services:
  homepage:
    image: ${HOMEPAGE_IMAGE}
    container_name: ${HOMEPAGE_CONTAINER_NAME}
    ports:
      - ${HOMEPAGE_PORT}:3000
    env_file: .env
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    external: true